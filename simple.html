<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bryce DesBrisay — Resume</title>
<script src="./PROFILE.js"></script>
<script src="./PROJECTS.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #555555;
    --rule: #e5e5e5;
    --accent: #4a90e2;
    --font-base: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: var(--font-base);
    color: var(--text);
    background: var(--bg);
    line-height: 1.65;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page {
    max-width: 820px;
    margin: 48px auto;
    padding: 48px 32px;
  }
  @media print {
    .page { margin:0; padding:24px; max-width:100%; }
    a { color: inherit; text-decoration: none; }
    .no-print { display:none !important; }
  }
  header {
    display:flex; gap:24px; align-items:center; margin-bottom:32px;
  }
  .avatar {
    width:96px; height:96px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:1px solid var(--rule);
  }
  h1.name { font-size:32px; font-weight:700; letter-spacing:-0.3px; line-height:1.2; }
  .title { font-size:18px; color:var(--muted); margin-top:6px; font-weight:500; }
  .meta { font-size:14px; color:var(--muted); margin-top:6px; }
  .bio { margin-top:16px; font-size:16px; color:#333; line-height:1.7; }
  hr { border:none; border-top:1px solid var(--rule); margin:32px 0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); margin-bottom:16px; font-weight:600; }
  .experience { display:flex; flex-direction:column; gap:28px; }
  .job {
    display:grid; grid-template-columns: 160px 1fr; gap:16px;
    opacity:0; transform:translateY(12px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .job.is-visible { opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce) {
    .job { opacity:1; transform:none; transition:none; }
  }
  .job-date { font-size:13px; color:var(--muted); white-space:nowrap; padding-top:4px; }
  h3.job-title { font-weight:600; font-size:18px; line-height:1.3; margin:0; }
  .job-company { font-weight:600; font-size:16px; margin-left:8px; color:var(--text); }

  .job-desc { font-size:15px; color:#333; margin-top:8px; line-height:1.7; }
  .job-tags { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:11px; background:#f3f3f3; color:#444; padding:3px 10px; border-radius:999px; }
  .links { margin-top:8px; font-size:14px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; }
  .links a:hover, .links a:focus { text-decoration:underline; }
  footer { margin-top:48px; font-size:13px; color:var(--muted); text-align:center; line-height:1.6; }
  .no-print { margin-top:24px; text-align:center; }
  button.print {
    padding:10px 18px; border:1px solid var(--rule); background:#f7f7f7; cursor:pointer; font-size:14px;
    border-radius:6px;
  }
  button.print:hover { background:#eee; }
  button.print:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  :focus:not(:focus-visible) { outline:none; }
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="no-print">
  <div style="max-width:820px;margin:0 auto;padding:0 32px 40px;">
    <button class="print" type="button" onclick="window.print()" aria-label="Print or save page as PDF">Print / Save PDF</button>
  </div>
</div>
<script>
  const profile = window.PROFILE || PROFILE || {};
  const projects = window.PROJECTS || PROJECTS || [];

  const app = document.getElementById('app');

  const header = document.createElement('header');
  header.innerHTML = `
    <img class="avatar" src="${profile.picture || './images/bryceProfile2.jpg'}" alt="Bryce DesBrisay profile photo" loading="lazy" decoding="async" width="96" height="96" />
    <div>
      <h1 class="name">${profile.name || ''}</h1>
      <p class="title">${profile.title || ''}</p>
      <p class="meta">${profile.location || ''}</p>
      <p class="bio">${profile.bio || ''}</p>
    </div>
  `;
  app.appendChild(header);

  app.appendChild(document.createElement('hr'));

  const h2 = document.createElement('h2');
  h2.textContent = 'Experience';
  app.appendChild(h2);

  const exp = document.createElement('div');
  exp.className = 'experience';
  exp.setAttribute('aria-label', 'Work experience');
  projects.forEach(p => {
    const job = document.createElement('div');
    job.className = 'job';
    const links = (p.links || []).map(l => `<a href="${l.link}" target="_blank" rel="noopener">${l.label}</a>`).join('');
    const tags = (p.tags || []).slice(0,8).map(t => `<span class="tag">${t.title}</span>`).join('');
    job.innerHTML = `
      <div class="job-date">${p.dates || ''}</div>
      <div class="job-main">
        <h3 class="job-title">${p.position || ''}<span class="job-company">${p.title || ''}</span></h3>
        <div class="job-desc">${p.description || ''}</div>
        ${tags ? `<div class="job-tags">${tags}</div>` : ''}
        ${links ? `<div class="links">${links}</div>` : ''}
      </div>
    `;
    exp.appendChild(job);
  });
  app.appendChild(exp);

  // Fade-in on view with reduced-motion respect
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.job').forEach(el => observer.observe(el));
  } else {
    document.querySelectorAll('.job').forEach(el => el.classList.add('is-visible'));
  }

  const footer = document.createElement('footer');
  footer.innerHTML = `Generated from PROFILE.js & PROJECTS.js • simple.html<br><small>© ${new Date().getFullYear()} Bryce DesBrisay. Crafted with care.</small>`;
  app.appendChild(footer);
</script>
</body>
</html>
