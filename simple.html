<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bryce DesBrisay — Resume</title>
<script src="./PROFILE.js"></script>
<script src="./PROJECTS.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --rule: #e2e8f0;
    --card: #f8fafc;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 72px 32px 120px;
  }
  @media print {
    .page { margin:0; padding:24px; max-width:100%; }
    a { color: inherit; text-decoration: none; }
    .no-print { display:none !important; }
    .card { break-inside: avoid; }
  }
  header {
    display:grid; grid-template-columns: 112px 1fr; gap:28px; align-items:start; margin-bottom:64px;
  }
  .avatar {
    width:112px; height:112px; border-radius:16px; object-fit:cover; flex-shrink:0;
    border:1px solid var(--rule); background:#fff;
  }
  .name { font-size:34px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; }
  .title { font-size:18px; color:var(--muted); margin-top:8px; }
  .meta { font-size:14px; color:var(--muted); margin-top:6px; }
  .bio { margin-top:18px; font-size:16px; color:#334155; max-width:68ch; }
  h2.section { font-size:13px; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); margin-bottom:28px; font-weight:600; }
  .timeline { display:flex; flex-direction:column; gap:32px; }
  .item {
    display:grid;
    grid-template-columns: 140px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width: 720px) {
    header { grid-template-columns: 88px 1fr; }
    .avatar { width:88px; height:88px; }
    .name { font-size:28px; }
    .item { grid-template-columns: 1fr; gap:12px; }
    .date-gutter { font-size:13px; }
  }
  .date-gutter {
    font-variant-numeric: tabular-nums;
    font-size:13px; color:var(--muted); white-space:nowrap; padding-top:8px;
  }
  .card {
    position:relative;
    background: var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:20px 20px 18px;
    overflow:hidden;
    --accent: #64748b;
  }
  .card::before {
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background: var(--accent);
    opacity:.9;
  }
  .card-head {
    display:flex; align-items:flex-start; gap:14px;
  }
  .logo {
    width:44px; height:44px; border-radius:10px; object-fit:contain; background:#fff; border:1px solid var(--rule); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);
  }
  .title-row {
    flex:1; min-width:0;
  }
  .proj-title { font-size:18px; font-weight:600; line-height:1.2; color: var(--text); }
  .proj-position { font-size:14px; color:var(--muted); margin-top:2px; }
  .proj-dates { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .proj-desc { margin-top:12px; font-size:15px; color:#334155; }
  .meta-row { margin-top:14px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag {
    font-size:11px; padding:3px 9px; border-radius:999px;
    background:#ffffff; border:1px solid var(--rule); color:#475569;
  }
  .links { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; }
  .links a { color: var(--text); text-decoration:none; opacity:.8; }
  .links a:hover { opacity:1; text-decoration:underline; }
  footer { margin-top:80px; font-size:12px; color:var(--muted); text-align:center; }
  .no-print { margin-top:32px; text-align:center; }
  button.print { padding:10px 18px; border:1px solid var(--rule); background:#f7f7f7; cursor:pointer; font-size:14px; border-radius:8px; }
  button.print:hover { background:#eee; }
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="no-print">
  <div style="max-width:820px;margin:0 auto;padding:0 32px 40px;">
    <button class="print" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>
<script>
  const profile = (typeof PROFILE !== 'undefined' ? PROFILE : window.PROFILE) || {};
  const projects = (typeof PROJECTS !== 'undefined' ? PROJECTS : window.PROJECTS) || [];

  const app = document.getElementById('app');

  const header = document.createElement('header');
  const avatarSrc = profile.picture || profile.image || './images/bryceProfile2.jpg';
  header.innerHTML = `
    <img class="avatar" src="${avatarSrc}" alt="Profile photo" />
    <div>
      <div class="name">${profile.name || profile.title || ''}</div>
      <div class="title">${profile.title || profile.position || ''}</div>
      <div class="meta">${profile.location || ''}</div>
      <div class="bio">${profile.bio || profile.description || ''}</div>
    </div>
  `;
  app.appendChild(header);

  const h2 = document.createElement('h2');
  h2.className = 'section';
  h2.textContent = 'Experience';
  app.appendChild(h2);

  const timeline = document.createElement('div');
  timeline.className = 'timeline';
  projects.forEach(p => {
    const item = document.createElement('div');
    item.className = 'item';
    const primary = (p.colors && p.colors.primary) || (p.colors && p.colors.background) || '#64748b';
    const logoSrc = p.image || '';
    const logoHTML = logoSrc
      ? `<img class="logo" src="${logoSrc}" alt="${p.title} logo" />`
      : `<div class="logo">${(p.title||'').charAt(0)}</div>`;
    const tags = (p.tags || []).slice(0,10).map(t => `<span class="tag">${t.title}</span>`).join('');
    const links = (p.links || []).filter(l => l.link).map(l => `<a href="${l.link}" target="_blank" rel="noopener">${l.label}</a>`).join('');
    item.innerHTML = `
      <div class="date-gutter">${p.dates || ''}</div>
      <div class="card" style="--accent:${primary}">
        <div class="card-head">
          ${logoHTML}
          <div class="title-row">
            <div class="proj-title">${p.title || ''}</div>
            <div class="proj-position">${p.position || ''}</div>
            <div class="proj-dates">${p.dates || ''}</div>
          </div>
        </div>
        <div class="proj-desc">${p.description || ''}</div>
        <div class="meta-row">
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          ${links ? `<div class="links">${links}</div>` : ''}
        </div>
      </div>
    `;
    timeline.appendChild(item);
  });
  app.appendChild(timeline);

  const footer = document.createElement('footer');
  footer.textContent = 'Generated from PROFILE.js & PROJECTS.js • simple.html';
  app.appendChild(footer);
</script>
</body>
</html>
