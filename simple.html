<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bryce DesBrisay — Resume</title>
<script src="./PROFILE.js"></script>
<script src="./PROJECTS.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #555555;
    --rule: #e5e5e5;
    --accent: #4a90e2;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 820px;
    margin: 40px auto;
    padding: 40px 32px;
  }
  @media print {
    .page { margin:0; padding:24px; max-width:100%; }
    a { color: inherit; text-decoration: none; }
    .no-print { display:none !important; }
  }
  header {
    display:flex; gap:24px; align-items:center; margin-bottom:32px;
  }
  .avatar {
    width:96px; height:96px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:1px solid var(--rule);
  }
  .name { font-size:28px; font-weight:600; letter-spacing:-0.2px; }
  .title { font-size:16px; color:var(--muted); margin-top:4px; }
  .meta { font-size:13px; color:var(--muted); margin-top:6px; }
  .bio { margin-top:16px; font-size:14px; color:#333; }
  hr { border:none; border-top:1px solid var(--rule); margin:28px 0; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin-bottom:12px; }
  .experience { display:flex; flex-direction:column; gap:24px; }
  .job {
    display:grid; grid-template-columns: 160px 1fr; gap:16px;
  }
  .job-date { font-size:13px; color:var(--muted); white-space:nowrap; }
  .job-main { }
  .job-title { font-weight:600; font-size:16px; }
  .job-company { font-weight:600; font-size:15px; margin-left:6px; color:var(--text); }
  .job-dates { font-size:13px; color:var(--muted); margin-left:8px; }
  .job-desc { font-size:13.5px; color:#333; margin-top:6px; }
  .job-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:11px; background:#f3f3f3; color:#444; padding:2px 8px; border-radius:999px; }
  .links { margin-top:6px; font-size:13px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:12px; }
  footer { margin-top:40px; font-size:12px; color:var(--muted); text-align:center; }
  .no-print { margin-top:24px; text-align:center; }
  button.print { padding:10px 18px; border:1px solid var(--rule); background:#f7f7f7; cursor:pointer; font-size:14px; }
  button.print:hover { background:#eee; }
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="no-print">
  <div style="max-width:820px;margin:0 auto;padding:0 32px 40px;">
    <button class="print" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>
<script>
  const profile = window.PROFILE || {};
  const projects = window.PROJECTS || [];

  const app = document.getElementById('app');

  const header = document.createElement('header');
  header.innerHTML = `
    <img class="avatar" src="${profile.picture || './images/bryceProfile2.jpg'}" alt="Profile photo" />
    <div>
      <div class="name">${profile.name || ''}</div>
      <div class="title">${profile.title || ''}</div>
      <div class="meta">${profile.location || ''}</div>
      <div class="bio">${profile.bio || ''}</div>
    </div>
  `;
  app.appendChild(header);

  app.appendChild(document.createElement('hr'));

  const h2 = document.createElement('h2');
  h2.textContent = 'Experience';
  app.appendChild(h2);

  const exp = document.createElement('div');
  exp.className = 'experience';
  projects.forEach(p => {
    const job = document.createElement('div');
    job.className = 'job';
    const links = (p.links || []).map(l => `<a href="${l.link}" target="_blank">${l.label}</a>`).join('');
    const tags = (p.tags || []).slice(0,8).map(t => `<span class="tag">${t.title}</span>`).join('');
    job.innerHTML = `
      <div class="job-date">${p.dates || ''}</div>
      <div class="job-main">
        <div>
          <span class="job-title">${p.position || ''}</span>
          <span class="job-company">${p.title || ''}</span>
          <span class="job-dates">${p.dates || ''}</span>
        </div>
        <div class="job-desc">${p.description || ''}</div>
        ${tags ? `<div class="job-tags">${tags}</div>` : ''}
        ${links ? `<div class="links">${links}</div>` : ''}
      </div>
    `;
    exp.appendChild(job);
  });
  app.appendChild(exp);

  const footer = document.createElement('footer');
  footer.textContent = 'Generated from PROFILE.js & PROJECTS.js • simple.html';
  app.appendChild(footer);
</script>
</body>
</html>
