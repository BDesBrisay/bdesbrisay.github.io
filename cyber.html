  let velX = 0, velY = reducedMotion ? 0 : 0.0022;
  let dragging = false, lastMX = 0, lastMY = 0;
  const mouse = { x: -1e4, y: -1e4 };
  const IDLE_SPIN = reducedMotion ? 0 : 0.0022;
  let scrollVel = 0, lastScrollY = window.scrollY, lastScrollT = performance.now();
  let pageVisible = true;
  let fps = 60, lastFpsT = performance.now(), frames = 0;

  function paletteTriple() {
    if (settings.palette === "auto") {
      return [shade(tgt, 0.4), tgt, { r: 230, g: 255, b: 230 }];
    }
    if (settings.palette === "custom") {
      const c = hexToRgb(settings.custom);
      return [shade(c, 0.35), c, { r: 255, g: 240, b: 255 }];
    }
    const p = PALETTES.find((x) => x.id === settings.palette);
    return p.swatches.map(hexToRgb);
  }

  function accentNow() {
    if (settings.palette === "auto") return sections[Math.max(activeIdx, 0)].color;
    return paletteTriple()[1];
  }

  function applyChrome() {
    const a = accentNow();
    document.documentElement.style.setProperty("--accent", cssRgb(a));
    document.documentElement.style.setProperty("--accent-rgb", (a.r | 0) + ", " + (a.g | 0) + ", " + (a.b | 0));
    barEl.style.background = cssRgb(a);
    tgt = a;
  }

  function kickGlitch() {
    if (!reducedMotion) glitch = 1;
  }

  function showFlash(msg) {
    flashEl.textContent = msg;
    flashEl.hidden = false;
    clearTimeout(showFlash._t);
    showFlash._t = setTimeout(() => { flashEl.hidden = true; }, 700);
  }

  function setShape(idx, kick) {
    activeIdx = idx;
    const s = sections[idx];
    for (let i = 0; i < N; i++) {
      const p = s.gen(i, N, R);
      tx[i] = p[0]; ty[i] = p[1]; tz[i] = p[2];
      if (kick && !reducedMotion && settings.motion) {
        vx[i] += (Math.random() - 0.5) * 6;
        vy[i] += (Math.random() - 0.5) * 6;
        vz[i] += (Math.random() - 0.5) * 6;
      }
    }
    applyChrome();
    if (small || s.side === "center") offsetXTgt = 0;
    else offsetXTgt = W * 0.24;
    if (s.id === "outro") offsetYTgt = -H * 0.18;
    else if (s.side === "center") offsetYTgt = 0;
    else offsetYTgt = small ? -H * 0.14 : 0;
    if (kick) {
      kickGlitch();
      click();
    }
  }

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    lastMX = e.clientX; lastMY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  window.addEventListener("pointermove", (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (dragging) {
      const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
      velY = dx * 0.00028 + velY * 0.5;
      velX = dy * 0.00028 + velX * 0.5;
      rotY += dx * 0.005;
      rotX += dy * 0.005;
      lastMX = e.clientX; lastMY = e.clientY;
    }
  });
  window.addEventListener("pointerup", () => { dragging = false; });
  window.addEventListener("blur", () => { mouse.x = -1e4; mouse.y = -1e4; dragging = false; });

  function jumpTo(idx) {
    document.getElementById("sec-" + sections[idx].id)
      .scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth" });
  }

  function findActiveSection() {
    const centerY = window.scrollY + window.innerHeight / 2;
    for (let k = 0; k < sections.length; k++) {
      const el = document.getElementById("sec-" + sections[k].id);
      if (centerY >= el.offsetTop && centerY < el.offsetTop + el.offsetHeight) return k;
    }
    return window.scrollY <= 0 ? 0 : sections.length - 1;
  }

  function allocTargets() {
    if (!gl) return;
    destroyFBO(gpu.acc[0]); destroyFBO(gpu.acc[1]);
    destroyFBO(gpu.bloomA); destroyFBO(gpu.bloomB);
    const w = canvas.width, h = canvas.height;
    let a = createFBO(w, h, gpu.useFloat);
    if (!a && gpu.useFloat) {
      gpu.useFloat = false;
      a = createFBO(w, h, false);
    }
    gpu.acc[0] = a;
    gpu.acc[1] = createFBO(w, h, gpu.useFloat);
    gpu.bloomA = createFBO(Math.max(1, w >> 2), Math.max(1, h >> 2), gpu.useFloat);
    gpu.bloomB = createFBO(Math.max(1, w >> 2), Math.max(1, h >> 2), gpu.useFloat);
    [gpu.acc[0], gpu.acc[1], gpu.bloomA, gpu.bloomB].forEach((f) => {
      if (!f) return;
      gl.bindFramebuffer(gl.FRAMEBUFFER, f.fb);
      gl.viewport(0, 0, f.w, f.h);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 0.7 + (settings.detail / 100) * 0.8);
    DPR = Math.min(DPR, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    small = W < MOBILE_BP;
    canvas.width = Math.max(1, (W * DPR) | 0);
    canvas.height = Math.max(1, (H * DPR) | 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    R = small
      ? Math.max(100, Math.min(270, Math.min(W * 0.36, H * 0.16)))
      : Math.max(140, Math.min(270, Math.min(W, H) * 0.34));
    if (gl) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      allocTargets();
    }
    if (activeIdx >= 0) setShape(activeIdx, false);
  }
  window.addEventListener("resize", resize);

  function bindFBO(fbo) {
    if (fbo) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
      gl.viewport(0, 0, fbo.w, fbo.h);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
  }
  function drawQuad(prog) {
    gl.useProgram(prog);
    gl.bindVertexArray(gpu.quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function renderGL(now) {
    if (!gl || !gpu.acc[0] || !gpu.acc[1]) return;
    const nDraw = Math.max(400, Math.floor(N * (0.42 + 0.58 * (settings.detail / 100))));
    const flat = sections[activeIdx] && sections[activeIdx].flat;
    const motionOn = settings.motion && !reducedMotion;
    const swingAmp = (sections[activeIdx] && sections[activeIdx].swing) ?? 0.26;
    const wobble = flat && motionOn ? Math.sin(now * 0.00045) * swingAmp : 0;
    const cy = Math.cos(rotY + wobble), syn = Math.sin(rotY + wobble);
    const cx = Math.cos(rotX), sx = Math.sin(rotX);
    const cxs = W / 2 + offsetX, cys = H / 2 + offsetY;
    const turb = (!motionOn || reducedMotion) ? 0 : Math.min(Math.abs(scrollVel) * 2.4, 3.2);
    const t = now * 0.002;
    const br = cur.r, bg = cur.g, bb = cur.b;

    let k = 0;
    for (let i = 0; i < nDraw; i++) {
      vx[i] = (vx[i] + (tx[i] - px[i]) * 0.016) * 0.9;
      vy[i] = (vy[i] + (ty[i] - py[i]) * 0.016) * 0.9;
      vz[i] = (vz[i] + (tz[i] - pz[i]) * 0.016) * 0.9;
      if (turb > 0.02) {
        vx[i] += (Math.random() - 0.5) * turb;
        vy[i] += (Math.random() - 0.5) * turb + scrollVel * 1.4 * Math.random();
        vz[i] += (Math.random() - 0.5) * turb;
      }
      px[i] += vx[i]; py[i] += vy[i]; pz[i] += vz[i];
      let x = px[i] * cy - pz[i] * syn;
      let z = px[i] * syn + pz[i] * cy;
      let y = py[i] * cx - z * sx;
      z = py[i] * sx + z * cx;
      const s = FOV / (FOV + z + 420);
      const sxp = cxs + x * s;
      const syp = cys + y * s;
      const mdx = sxp - mouse.x, mdy = syp - mouse.y;
      const md2 = mdx * mdx + mdy * mdy;
      if (md2 < 16900 && md2 > 0.01) {
        const f = (1 - Math.sqrt(md2) / 130) * 2.2;
        const inv = 1 / Math.sqrt(md2);
        vx[i] += (mdx * inv * f) * cy;
        vz[i] -= (mdx * inv * f) * syn;
        vy[i] += mdy * inv * f;
      }
      const wMix = Math.max(0, Math.min(0.5, (420 - z) * 0.0009)) + ((i % 40) / 40) * 0.18;
      const rad = Math.max(1.2, sz[i] * s * (settings.mode === "3d" ? 3.2 : 2.4) * DPR);
      particleData[k++] = sxp * DPR;
      particleData[k++] = syp * DPR;
      particleData[k++] = rad;
      particleData[k++] = wMix;
      particleData[k++] = tw[i];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, gpu.particleBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, particleData.subarray(0, nDraw * 5));

    const src = gpu.acc[gpu.ping];
    const dst = gpu.acc[1 - gpu.ping];
    bindFBO(dst);
    gl.disable(gl.BLEND);
    gl.useProgram(gpu.fade);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(gpu.fade.u.uPrev, 0);
    gl.uniform1f(gpu.fade.u.uFade, settings.mode === "dither" ? 0.28 : 0.66);
    drawQuad(gpu.fade);

    if (settings.grid) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(gpu.grid);
      gl.uniform3f(gpu.grid.u.uColor, br / 255, bg / 255, bb / 255);
      gl.uniform1f(gpu.grid.u.uTime, motionOn ? now * 0.001 : 0);
      gl.uniform1f(gpu.grid.u.uRotY, rotY);
      gl.uniform1f(gpu.grid.u.uAlpha, settings.mode === "dither" ? 0.08 : 0.16);
      drawQuad(gpu.grid);
    }

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(gpu.point);
    gl.uniform2f(gpu.point.u.uResolution, dst.w, dst.h);
    gl.uniform1f(gpu.point.u.uTime, now * 0.001);
    gl.uniform1f(gpu.point.u.uTwinkle, motionOn ? 1 : 0);
    gl.uniform3f(gpu.point.u.uColor, br / 255, bg / 255, bb / 255);
    gl.bindVertexArray(gpu.particleVao);
    gl.drawArrays(gl.POINTS, 0, nDraw);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);

    const bloomAmt = settings.mode === "3d" ? 0.85 : settings.mode === "ascii" ? 0.28 : 0.0;
    if (bloomAmt > 0.01 && gpu.bloomA && gpu.bloomB) {
      bindFBO(gpu.bloomA);
      gl.useProgram(gpu.blit);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, dst.tex);
      gl.uniform1i(gpu.blit.u.uScene, 0);
      drawQuad(gpu.blit);
      bindFBO(gpu.bloomB);
      gl.useProgram(gpu.blur);
      gl.bindTexture(gl.TEXTURE_2D, gpu.bloomA.tex);
      gl.uniform1i(gpu.blur.u.uScene, 0);
      gl.uniform2f(gpu.blur.u.uDir, 1 / gpu.bloomA.w, 0);
      drawQuad(gpu.blur);
      bindFBO(gpu.bloomA);
      gl.bindTexture(gl.TEXTURE_2D, gpu.bloomB.tex);
      gl.uniform2f(gpu.blur.u.uDir, 0, 1 / gpu.bloomB.h);
      drawQuad(gpu.blur);
    }

    const pal = paletteTriple();
    bindFBO(null);
    gl.useProgram(gpu.post);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dst.tex);
    gl.uniform1i(gpu.post.u.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, (gpu.bloomA && gpu.bloomA.tex) || dst.tex);
    gl.uniform1i(gpu.post.u.uBloom, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, gpu.glyphTex);
    gl.uniform1i(gpu.post.u.uGlyph, 2);
    gl.uniform2f(gpu.post.u.uResolution, canvas.width, canvas.height);
    gl.uniform1f(gpu.post.u.uMode, settings.mode === "ascii" ? 0 : settings.mode === "dither" ? 1 : 2);
    gl.uniform1f(gpu.post.u.uDetail, settings.detail / 100);
    gl.uniform1f(gpu.post.u.uGlyphs, glyphCount);
    gl.uniform1f(gpu.post.u.uTime, motionOn ? now * 0.001 : 0);
    gl.uniform1f(gpu.post.u.uGlitch, glitch);
    gl.uniform1f(gpu.post.u.uCRT, settings.crt ? 1 : 0);
    gl.uniform1f(gpu.post.u.uRain, settings.rain && settings.mode === "ascii" ? 1 : 0);
    gl.uniform1f(gpu.post.u.uMono, settings.mono ? 1 : 0);
    gl.uniform1f(gpu.post.u.uBloomAmt, bloomAmt);
    gl.uniform1f(gpu.post.u.uFlicker, motionOn ? 1 : 0);
    gl.uniform3f(gpu.post.u.uPalette1, pal[0].r / 255, pal[0].g / 255, pal[0].b / 255);
    gl.uniform3f(gpu.post.u.uPalette2, pal[1].r / 255, pal[1].g / 255, pal[1].b / 255);
    gl.uniform3f(gpu.post.u.uPalette3, pal[2].r / 255, pal[2].g / 255, pal[2].b / 255);
    gl.uniform3f(gpu.post.u.uBg, 0.012, 0.02, 0.016);
    drawQuad(gpu.post);

    gpu.ping = 1 - gpu.ping;
  }

  function frame(now) {
    const sy = window.scrollY;
    const dt = Math.max(now - lastScrollT, 1);
    scrollVel = scrollVel * 0.88 + ((sy - lastScrollY) / dt) * 0.12;
    lastScrollY = sy; lastScrollT = now;

    const idx = findActiveSection();
    if (idx !== activeIdx) setShape(idx, true);
    if (sections[activeIdx].animate && settings.motion && !reducedMotion) {
      sections[activeIdx].animate(now, tx, ty, tz, R, N);
    }

    if (sections[activeIdx].id === "hero") {
      const slot = document.getElementById("name-slot");
      if (slot) {
        const rect = slot.getBoundingClientRect();
        offsetXTgt = rect.left + rect.width / 2 - W / 2;
        offsetYTgt = rect.top + rect.height / 2 - H / 2;
      }
    } else if (small && sections[activeIdx].cardEl) {
      const rect = sections[activeIdx].cardEl.getBoundingClientRect();
      const bandTop = 60;
      let centerY = (bandTop + Math.min(rect.top, H)) / 2;
      centerY = Math.max(H * 0.16, Math.min(H * 0.5, centerY));
      offsetXTgt = 0;
      offsetYTgt = centerY - H / 2;
    }

    const total = document.documentElement.scrollHeight - H;
    barEl.style.width = (total > 0 ? (sy / total) * 100 : 0) + "%";
    updateMarkers();

    const flat = sections[activeIdx] && sections[activeIdx].flat;
    const motionOn = settings.motion && !reducedMotion;
    if (!dragging) {
      if (flat) {
        const TAU = Math.PI * 2;
        const homeY = Math.round(rotY / TAU) * TAU;
        rotY += (homeY - rotY) * 0.055;
        rotX += (0 - rotX) * 0.055;
        velX *= 0.85; velY *= 0.85;
      } else {
        rotY += velY; rotX += velX;
        velX *= 0.95;
        velY = velY * 0.95 + (motionOn ? IDLE_SPIN : 0) * 0.05;
      }
    }
    rotX = Math.max(-1.4, Math.min(1.4, rotX));

    cur.r += (tgt.r - cur.r) * 0.045;
    cur.g += (tgt.g - cur.g) * 0.045;
    cur.b += (tgt.b - cur.b) * 0.045;
    offsetX += (offsetXTgt - offsetX) * 0.06;
    offsetY += (offsetYTgt - offsetY) * 0.06;
    glitch *= reducedMotion ? 0 : 0.9;

    if (gl) renderGL(now);

    frames++;
    if (now - lastFpsT > 500) {
      fps = Math.round(frames * 1000 / (now - lastFpsT));
      frames = 0;
      lastFpsT = now;
    }
    const node = String(activeIdx + 1).padStart(2, "0") + "/" + String(sections.length).padStart(2, "0");
    hudStatus.textContent = gl
      ? settings.mode.toUpperCase() + " · " + fps + " FPS · NODE " + node + " · 37.77°N 122.42°W"
      : "RENDERER OFFLINE · NODE " + node + " · 37.77°N 122.42°W";

    if (pageVisible) requestAnimationFrame(frame);
  }

  document.addEventListener("visibilitychange", () => {
    pageVisible = document.visibilityState === "visible";
    if (pageVisible) requestAnimationFrame(frame);
  });

  // ---------------------------------------------------------------
  // console / settings
  // ---------------------------------------------------------------
  const settingsEl = document.getElementById("settings");
  const detailEl = document.getElementById("detail");
  const detailLabel = document.getElementById("detail-label");
  const paletteLabel = document.getElementById("palette-label");
  const palettesEl = document.getElementById("palettes");

  function setMode(mode, announce) {
    settings.mode = mode;
    document.documentElement.dataset.mode = mode;
    document.querySelectorAll(".console-tabs [data-mode]").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false");
    });
    const cycle = document.getElementById("cycle-mode");
    if (cycle) cycle.textContent = mode.toUpperCase();
    if (announce) {
      kickGlitch();
      showFlash("REROUTING RENDERER -> " + mode.toUpperCase());
      click();
    }
    saveSettings();
  }

  function refreshToggles() {
    document.getElementById("tog-rain").checked = settings.rain;
    document.getElementById("tog-crt").checked = settings.crt;
    document.getElementById("tog-grid").checked = settings.grid;
    document.getElementById("tog-motion").checked = settings.motion;
    document.getElementById("tog-sound").checked = settings.sound;
    document.getElementById("tog-mono").checked = settings.mono;
    document.documentElement.dataset.crt = settings.crt ? "1" : "0";
    document.documentElement.dataset.rain = settings.rain ? "1" : "0";
    document.documentElement.dataset.grid = settings.grid ? "1" : "0";
    detailEl.value = String(settings.detail);
    detailLabel.textContent = settings.detail < 40 ? "LOW" : settings.detail < 80 ? "BALANCED" : "ULTRA";
    const p = PALETTES.find((x) => x.id === settings.palette);
    paletteLabel.textContent = p ? p.name : "AUTO";
    palettesEl.querySelectorAll("button, label").forEach((el) => {
      const id = el.dataset.id;
      const on = id === settings.palette;
      if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", on ? "true" : "false");
      else el.classList.toggle("selected", on);
    });
    applyChrome();
  }

  PALETTES.forEach((p) => {
    if (p.id === "custom") {
      const lab = document.createElement("label");
      lab.className = "custom";
      lab.dataset.id = "custom";
      lab.title = "Custom accent";
      lab.innerHTML = '<input type="color" aria-label="Custom accent color" /><span style="background:' + settings.custom + ';flex:1"></span>';
      const input = lab.querySelector("input");
      input.value = settings.custom;
      input.addEventListener("input", () => {
        settings.custom = input.value;
        settings.palette = "custom";
        lab.querySelector("span").style.background = settings.custom;
        refreshToggles();
        saveSettings();
        kickGlitch();
      });
      palettesEl.appendChild(lab);
      return;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.id = p.id;
    btn.setAttribute("aria-label", p.name + " palette");
    btn.innerHTML = p.swatches.map((c) => "<span style=\"background:" + c + "\"></span>").join("");
    btn.addEventListener("click", () => {
      settings.palette = p.id;
      refreshToggles();
      saveSettings();
      kickGlitch();
    });
    palettesEl.appendChild(btn);
  });

  document.querySelectorAll(".console-tabs [data-mode]").forEach((b) => {
    b.addEventListener("click", () => setMode(b.dataset.mode, true));
  });
  document.getElementById("cycle-mode").addEventListener("click", () => {
    const order = ["ascii", "dither", "3d"];
    setMode(order[(order.indexOf(settings.mode) + 1) % 3], true);
  });
  function toggleSettings() {
    const open = settingsEl.hidden;
    settingsEl.hidden = !open;
    document.getElementById("gear").setAttribute("aria-expanded", open ? "true" : "false");
  }
  document.getElementById("gear").addEventListener("click", toggleSettings);
  document.getElementById("gear-m").addEventListener("click", toggleSettings);

  detailEl.addEventListener("input", () => {
    settings.detail = +detailEl.value;
    refreshToggles();
    resize();
    saveSettings();
  });
  [["tog-rain", "rain"], ["tog-crt", "crt"], ["tog-grid", "grid"], ["tog-motion", "motion"], ["tog-mono", "mono"]].forEach(([id, key]) => {
    document.getElementById(id).addEventListener("change", (e) => {
      settings[key] = e.target.checked;
      refreshToggles();
      saveSettings();
    });
  });
  document.getElementById("tog-sound").addEventListener("change", (e) => {
    settings.sound = e.target.checked;
    setSound(settings.sound);
    saveSettings();
  });

  function typingTarget(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
  }

  window.addEventListener("keydown", (e) => {
    if (typingTarget(e.target)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "1") setMode("ascii", true);
    else if (e.key === "2") setMode("dither", true);
    else if (e.key === "3") setMode("3d", true);
    else if (e.key === "ArrowDown" || e.key === "PageDown" || e.code === "Space") {
      e.preventDefault();
      jumpTo(Math.min(Math.max(activeIdx, 0) + 1, sections.length - 1));
    } else if (e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault();
      jumpTo(Math.max(activeIdx - 1, 0));
    }
  });

  // ---------------------------------------------------------------
  // terminal
  // ---------------------------------------------------------------
  const termOut = document.getElementById("term-out");
  const termIn = document.getElementById("term-input");
  function termPrint(html) {
    termOut.innerHTML += "\n" + html;
    termOut.scrollTop = termOut.scrollHeight;
  }
  function runTerm(line) {
    const raw = line.trim();
    const [cmd, ...rest] = raw.split(/\s+/);
    const arg = rest.join(" ");
    termPrint('<span class="ok">&gt; ' + esc(raw) + "</span>");
    if (!cmd || cmd === "help") {
      termPrint("help | whoami | ls | open &lt;id|github|linkedin|contact&gt;\nmode &lt;ascii|dither|3d&gt; | palette &lt;auto|matrix|neon|amber|ice&gt;\nmatrix | cat bio | clear");
    } else if (cmd === "whoami") {
      termPrint(esc(profile.name) + "\n" + esc(profile.tagline) + "\n" + esc(profile.location));
    } else if (cmd === "ls") {
      termPrint(sections.map((s, i) => String(i).padStart(2, "0") + "  " + s.id).join("\n"));
    } else if (cmd === "open") {
      const key = arg.toLowerCase();
      const social = profile.socials.find((s) => s.label.toLowerCase().includes(key) || key === "github" && /github/i.test(s.link) || key === "linkedin" && /linkedin/i.test(s.link) || key === "contact" && /contact|forms/i.test(s.label + s.link));
      if (social) { window.open(social.link, "_blank", "noopener"); termPrint("opening " + esc(social.label)); }
      else {
        const sec = sections.find((s) => s.id === key || s.label.toLowerCase() === key);
        if (sec) { jumpTo(sections.indexOf(sec)); termPrint("seeking /" + sec.id); }
        else termPrint('<span class="err">unknown target</span>');
      }
    } else if (cmd === "mode") {
      if (arg === "ascii" || arg === "dither" || arg === "3d") { setMode(arg, true); termPrint("renderer = " + arg); }
      else termPrint('<span class="err">mode ascii|dither|3d</span>');
    } else if (cmd === "palette") {
      const p = PALETTES.find((x) => x.id === arg);
      if (p && p.id !== "custom") { settings.palette = p.id; refreshToggles(); saveSettings(); kickGlitch(); termPrint("palette = " + p.name); }
      else termPrint('<span class="err">palette auto|matrix|neon|amber|ice</span>');
    } else if (cmd === "matrix") {
      settings.palette = "matrix";
      settings.rain = true;
      settings.crt = true;
      setMode("ascii", true);
      refreshToggles();
      saveSettings();
      termPrint("follow the white rabbit");
    } else if (cmd === "clear") {
      termOut.textContent = "";
    } else if (cmd === "cat" && arg === "bio") {
      termPrint(stripHtml(formatBio(profile)));
    } else {
      termPrint('<span class="err">command not found — try help</span>');
    }
  }
  if (termIn) {
    termIn.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        runTerm(termIn.value);
        termIn.value = "";
      }
    });
  }

  // ---------------------------------------------------------------
  // boot
  // ---------------------------------------------------------------
  function finishBoot() {
    document.documentElement.classList.remove("booting");
    document.getElementById("boot").hidden = true;
    try { sessionStorage.setItem("bryce-cyber-booted", "1"); } catch (e) {}
    scrambleTo(document.getElementById("hero-sub"), profile.tagline, 900);
    scrambleTo(document.getElementById("hero-loc"), profile.location, 1100);
  }

  function runBoot(done) {
    const boot = document.getElementById("boot");
    const log = document.getElementById("boot-log");
    let skipped = false;
    const skip = () => { if (skipped) return; skipped = true; done(); };
    if (reducedMotion) { try { if (sessionStorage.getItem("bryce-cyber-booted")) { /* still skip visually */ } } catch (e) {} skip(); return; }
    try { if (sessionStorage.getItem("bryce-cyber-booted")) { skip(); return; } } catch (e) {}
    document.documentElement.classList.add("booting");
    boot.hidden = false;
    const lines = [
      "> BRYCE.EXE v2026.09",
      "> mounting /experience … " + projects.length + " nodes",
      "> glyph atlas … " + glyphCount + " glyphs",
      "> renderer: " + settings.mode.toUpperCase(),
      "> OK",
    ];
    let i = 0, j = 0;
    log.textContent = "";
    const t0 = performance.now();
    function type() {
      if (skipped) return;
      if (i >= lines.length) {
        setTimeout(skip, 180);
        return;
      }
      const line = lines[i];
      if (j <= line.length) {
        const prefix = lines.slice(0, i).join("\n") + (i ? "\n" : "");
        log.textContent = prefix + line.slice(0, j) + "█";
        j++;
        setTimeout(type, 8);
      } else {
        i++; j = 0;
        setTimeout(type, 70);
      }
    }
    type();
    boot.addEventListener("click", skip);
    window.addEventListener("keydown", skip, { once: true });
    setTimeout(skip, 1800);
  }

  setMode(settings.mode, false);
  refreshToggles();
  if (settings.sound) setSound(true);
  resize();
  setShape(findActiveSection(), false);

  runBoot(() => {
    finishBoot();
    requestAnimationFrame(frame);
  });
})();

</script>
